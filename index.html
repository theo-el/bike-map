<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Zurich Bike & Scooter Share Map</title>
  <meta name="viewport" content="initial-scale=1,maximum-scale=1,user-scalable=no" />
  <link href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" rel="stylesheet" />
  <link href="style.css" rel="stylesheet" />
</head>
<body>
  <div id="map"></div>
  <div id="panel">
    <div id="status">
      <div><strong>Zurich Bike & Scooter Share</strong></div>
      <div id="status-lines"></div>
    </div>

    <div id="search-box">
      <div><strong>Destination</strong></div>
      <form id="destination-form">
        <input id="destination-input" type="text" placeholder="Search in Zurich…" autocomplete="off" />
        <button type="submit">Go</button>
      </form>
      <div id="destination-feedback"></div>
    </div>

    <div id="price-card" class="hidden">
      <div><strong>Trip estimate</strong></div>
      <div id="price-card-lines"></div>
    </div>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="config.js"></script>
  <script src="app.js"></script>
</body>
</html>
