<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Zurich Bike & Scooter Share Map</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />

  <!-- Home-screen app identity -->
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#0ea5a0" />
  <link rel="icon" href="icons/favicon-32.png" type="image/png" />

  <!-- iOS ignores parts of the manifest, so it needs its own tags. -->
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
  <meta name="apple-mobile-web-app-title" content="Bike Map" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <!-- black-translucent draws our own UI under the status bar — safe to do
       since everything already respects env(safe-area-inset-*). -->
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />

  <link href="https://unpkg.com/maplibre-gl@5.24.0/dist/maplibre-gl.css" rel="stylesheet" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link href="style.css" rel="stylesheet" />
</head>
<body>
  <div id="map"></div>

  <div id="panel">
    <div id="status" class="collapsed">
      <div class="status-header" id="status-header" tabindex="0" role="button" aria-expanded="false">
        <strong>Zurich Bike & Scooter Share</strong>
        <span class="status-actions">
          <button id="locate-btn" type="button" title="Locate me">📍</button>
          <button id="refresh-btn" type="button">Refresh</button>
        </span>
      </div>
      <div id="last-updated"></div>
      <div id="locate-feedback"></div>
      <div id="status-lines"></div>
    </div>

    <div id="search-box">
      <div class="search-label"><strong>Destination</strong></div>
      <form id="destination-form">
        <input id="destination-input" type="text" placeholder="Search in Zurich…" autocomplete="off" />
        <button type="submit">Go</button>
      </form>
      <div id="destination-feedback"></div>
    </div>

    <div id="price-card" class="hidden">
      <div class="sheet-handle"></div>
      <button id="price-card-summary" type="button"></button>
      <div id="price-card-lines"></div>
    </div>
  </div>

  <button id="locate-fab" class="fab" type="button" title="Locate me">📍</button>
  <button id="refresh-fab" class="fab" type="button" title="Refresh">⟳</button>

  <script src="https://unpkg.com/maplibre-gl@5.24.0/dist/maplibre-gl.js"></script>
  <script src="config.js"></script>
  <script src="app.js"></script>
</body>
</html>
